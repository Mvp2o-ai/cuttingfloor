name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The Mongo record store's suites run against a one-node replica set the job starts below
      # (the credit ledger writes in transactions, which a standalone server refuses).
      CUTTINGFLOOR_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      # No MongoDB fails these suites here instead of skipping them.
      CUTTINGFLOOR_REQUIRE_MONGO: '1'
      # The S3 blob store's suites run against a MinIO the job starts below (a service container
      # cannot be given MinIO's `server` command), and fail here without it.
      CUTTINGFLOOR_TEST_S3_ENDPOINT: http://127.0.0.1:9100
      CUTTINGFLOOR_REQUIRE_S3: '1'
      # The sound library's suite runs against MongoDB's Atlas image (Atlas Search and Vector
      # Search), which the job starts below, and fails here without it.
      CUTTINGFLOOR_TEST_ATLAS_URI: mongodb://127.0.0.1:27018/?directConnection=true
      CUTTINGFLOOR_REQUIRE_ATLAS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/test-s3.sh
      - run: scripts/test-mongo.sh
      - run: scripts/test-mongo.sh atlas
      - run: pnpm check
