name: Image

# Every PR and push: lint, typecheck and all tests (engine and end-to-end included) inside the
# image, then a smoke test of the built image as users run it. On main, and for releases, the
# image is published to GHCR for linux/amd64 and linux/arm64.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Release version (semver) to tag the image with
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/mvp2o-ai/cuttingfloor

jobs:
  test:
    name: Test in the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Lint, typecheck and test with FFmpeg and MLT
        uses: docker/build-push-action@v6
        with:
          target: test
          build-args: CUTTINGFLOOR_BENCH_SCALE=3
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke-test the image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: cuttingfloor:ci
          cache-from: type=gha
      - name: HTTP, stdio via docker exec, restart
        run: node scripts/smoke-image.ts cuttingfloor:ci

  publish:
    name: Publish to GHCR
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
