name: Image

# Every PR and push: lint, typecheck and all tests (engine and end-to-end included) inside the
# image, then a smoke test of the built image as users run it. Pushes to main and develop, and
# releases, publish the image to GHCR for linux/amd64 and linux/arm64 (:latest is main only):
# each platform builds on its own native runner, then one job tags both as one multi-arch image.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Release version (semver) to tag the image with
        type: string
        required: true
      ref:
        description: Git ref to build (the release tag)
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/mvp2o-ai/cuttingfloor

jobs:
  test:
    name: Test in the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Lint, typecheck and test with FFmpeg and MLT
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          build-args: CUTTINGFLOOR_BENCH_SCALE=3
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke-test the image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: cuttingfloor:ci
          cache-from: type=gha
          # On pushes, keep the runtime layers for the amd64 publish build (same image, all hits).
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=image-amd64,mode=max' || '' }}
      - name: HTTP, stdio via docker exec, restart
        run: node scripts/smoke-image.ts cuttingfloor:ci
      - name: Motion sandbox (compose), Chromium sandboxed, nothing reachable, abuse contained
        run: node scripts/smoke-motion.ts cuttingfloor:ci

  meta:
    name: Image tags and labels
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}

  # Each platform builds natively on its own runner (no emulation) and pushes untagged, by digest,
  # with its own cache scope (the test job owns the default one). publish then tags both as one.
  build:
    name: Build ${{ matrix.platform }}
    needs: [smoke, meta]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            # Its own scope, plus the test job's (the default scope) for the stages they share.
            cache_from: |
              type=gha,scope=image-amd64
              type=gha
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            cache_from: type=gha,scope=image-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push ${{ matrix.platform }} by digest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: ${{ matrix.cache_from }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag linux/amd64 + linux/arm64 as one image
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::expected 2 platform digests, got ${#sources[@]}"; exit 1
          fi
          tags=()
          while IFS= read -r t; do
            if [ -n "$t" ]; then tags+=(-t "$t"); fi
          done <<<"$TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Inspect
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: docker buildx imagetools inspect "$(head -n1 <<<"$TAGS")"

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.version == ''
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
