name: Release

# A promotion of develop into main is the release. scripts/promote-develop.sh versions pending
# changesets on develop first (version, changelog), so main only ever takes pull requests; here,
# a version on main without its tag gets the tag vX.Y.Z, a GitHub release, and the image as
# :X.Y.Z and :X.Y.

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "v${version}"
          git push origin "v${version}"
          awk -v v="## ${version}" '$0==v{on=1;next} /^## /{if(on)exit} on' apps/cli/CHANGELOG.md > notes.md
          gh release create "v${version}" --title "v${version}" --notes-file notes.md
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # The official MCP Registry lists the hosted server (server.json). Each release republishes it
  # at the new version, signed in with this repository's GitHub OIDC token: no stored secret.
  registry:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER: v1.8.6
      PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Publish
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          curl -fsSL -o publisher.tgz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  publisher.tgz" | sha256sum -c -
          tar -xzf publisher.tgz mcp-publisher
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  image:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: v${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
      # image.yml's test job reads workflow runs (it looks for develop's run on promotions).
      actions: read
