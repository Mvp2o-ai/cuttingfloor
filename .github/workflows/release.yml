name: Release

# When changesets land on main: bump the version, commit the changelog, tag vX.Y.Z, create the
# GitHub release, and publish the image as :X.Y.Z and :X.Y. (The organisation doesn't let Actions
# open pull requests, so there is no "version packages" PR: merging the changeset is the release.)

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pending=0
          for f in .changeset/*.md; do
            [ -e "$f" ] && [ "$(basename "$f")" != README.md ] && pending=1
          done
          if [ "$pending" = 0 ]; then
            echo "No changesets: nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm changeset version
          pnpm biome check --write apps/cli/package.json
          version=$(node -p "require('./apps/cli/package.json').version")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: release v${version}"
          git tag "v${version}"
          git push origin HEAD:main "v${version}"
          awk -v v="## ${version}" '$0==v{on=1;next} /^## /{if(on)exit} on' apps/cli/CHANGELOG.md > notes.md
          gh release create "v${version}" --title "v${version}" --notes-file notes.md
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: v${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
