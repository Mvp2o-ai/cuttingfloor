# One hosted cuttingfloor server: the node, its sandboxes under gVisor, and Caddy for TLS.
#   docker compose up -d        (up.sh runs this on the server)
services:
  cuttingfloor:
    image: ${CUTTINGFLOOR_IMAGE:-ghcr.io/mvp2o-ai/cuttingfloor:latest}
    container_name: cuttingfloor
    restart: unless-stopped
    networks: [default, motion]
    env_file: [cuttingfloor.env]
    # To the host's journal, so the logs outlive a deploy that replaces the container
    # (`docker logs` and `journalctl CONTAINER_NAME=cuttingfloor` both read them).
    logging: { driver: journald }
    environment:
      CUTTINGFLOOR_MODE: hosted
      CUTTINGFLOOR_MEDIA_ROOTS: ""
      CUTTINGFLOOR_MOTION_URL: http://motion:8790
      # Exports, imports and analysis at once (plus one slot kept for short jobs): 5 in all.
      CUTTINGFLOOR_MAX_JOBS: "4"
    volumes:
      - /var/lib/cuttingfloor:/data
      # The sign-up sequence's email copy, editable here without a deploy (CUTTINGFLOOR_EMAIL_TEMPLATES).
      - ./email:/etc/cuttingfloor/email:ro

  # The sandboxes: a fresh one per render. The launcher answers the main server as one sandbox
  # did, and behind each render starts a new motion-worker container under gVisor (no route out,
  # no data volume, no secrets, nothing writable but a tmpfs, no capabilities, its own CPU,
  # memory and process caps) and removes it after, as many at once as the machine holds. It is
  # the one container with the Docker socket, and it is on the internal network only.
  motion:
    image: ${CUTTINGFLOOR_IMAGE:-ghcr.io/mvp2o-ai/cuttingfloor:latest}
    container_name: cuttingfloor-motion
    command: ["cuttingfloor", "motion-launcher"]
    restart: unless-stopped
    logging: { driver: journald }
    networks: [motion]
    user: root
    environment:
      PORT: "8790"
      CUTTINGFLOOR_SANDBOX_IMAGE: ${CUTTINGFLOOR_IMAGE:-ghcr.io/mvp2o-ai/cuttingfloor:latest}
      CUTTINGFLOOR_SANDBOX_NETWORK: cuttingfloor_motion
      CUTTINGFLOOR_SANDBOX_RUNTIME: runsc
      CUTTINGFLOOR_SANDBOX_SECCOMP: /etc/cuttingfloor/seccomp.json
      # Browsers per render, about one per two CPUs of a render alone. Set here because gVisor
      # may not show a sandbox its CPU limit.
      CUTTINGFLOOR_MOTION_WORKERS: ${CUTTINGFLOOR_MOTION_WORKERS:-3}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./seccomp.json:/etc/cuttingfloor/seccomp.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 512m

  caddy:
    image: caddy:2.10.2
    container_name: caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: [cuttingfloor.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/sites:ro
      - caddy-data:/data

networks:
  motion:
    # Named, so the launcher can put each sandbox on it.
    name: cuttingfloor_motion
    internal: true

volumes:
  caddy-data:
