# One hosted cuttingfloor server: the node, its sandbox under gVisor, and Caddy for TLS.
#   docker compose up -d        (up.sh runs this on the server)
services:
  cuttingfloor:
    image: ${CUTTINGFLOOR_IMAGE:-ghcr.io/mvp2o-ai/cuttingfloor:latest}
    container_name: cuttingfloor
    restart: unless-stopped
    networks: [default, motion]
    env_file: [cuttingfloor.env]
    environment:
      CUTTINGFLOOR_MODE: hosted
      CUTTINGFLOOR_MEDIA_ROOTS: ""
      CUTTINGFLOOR_MOTION_URL: http://motion:8790
    volumes:
      - /var/lib/cuttingfloor:/data

  # The sandbox, as locally, plus gVisor: agent-written pages render on a user-space kernel.
  motion:
    image: ${CUTTINGFLOOR_IMAGE:-ghcr.io/mvp2o-ai/cuttingfloor:latest}
    container_name: cuttingfloor-motion
    command: ["cuttingfloor", "motion-worker"]
    runtime: runsc
    restart: unless-stopped
    networks: [motion]
    environment:
      PORT: "8790"
      HOME: /tmp
      TMPDIR: /tmp
      # Browsers per create.motion render, about one per two CPUs. Set here because gVisor
      # may not show the container its CPU limit.
      CUTTINGFLOOR_MOTION_WORKERS: ${CUTTINGFLOOR_MOTION_WORKERS:-3}
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
      - /data:rw,noexec,nosuid,nodev,size=64k
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
    init: true
    cpus: ${CUTTINGFLOOR_MOTION_CPUS:-6}
    mem_limit: 6g
    memswap_limit: 6g
    # Under gVisor (systrap) every guest thread costs host threads too, and a clone the host
    # refuses panics the whole sandbox, failing every job in it. So the host limit is only a
    # backstop; the real cap is nproc inside the sandbox, where a fork bomb fails its own job.
    # A three-browser 1080x1920 render peaks near 400 threads.
    pids_limit: 8192
    ulimits:
      nproc: 1024
    shm_size: 1g

  caddy:
    image: caddy:2.10.2
    container_name: caddy
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: [cuttingfloor.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/sites:ro
      - caddy-data:/data

networks:
  motion:
    internal: true

volumes:
  caddy-data:
