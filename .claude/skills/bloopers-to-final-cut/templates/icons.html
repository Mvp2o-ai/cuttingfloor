<!-- create.motion, transparent, 1080x1920, ~5.5 s. %D1% %D2% %D3% = seconds when each app is named, %PILL% = the address, %OUT% = exit. -->
<style>*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:transparent;font-family:"Inter",sans-serif}

 opacity:0;transform:scale(.8);animation:pop .4s cubic-bezier(.2,.9,.3,1.4) %PILL%s forwards}
@keyframes in{to{opacity:1;transform:none}}@keyframes out{to{opacity:0;transform:translateY(-30px)}}@keyframes pop{to{opacity:1;transform:none}}</style>
