# Local mode: the same image hosted runs, as a single node on your machine.
#   docker compose up -d
# MCP clients connect to http://127.0.0.1:8787/mcp, or over stdio with
#   docker exec -i cuttingfloor cuttingfloor mcp
services:
  cuttingfloor:
    image: ghcr.io/mvp2o-ai/cuttingfloor:latest
    build: .
    container_name: cuttingfloor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - path: .env
        required: false
    environment:
      CUTTINGFLOOR_MODE: local
      CUTTINGFLOOR_MEDIA_ROOTS: /media,/samples
      CUTTINGFLOOR_EXPORTS: /exports
      # Shown in export results so you know where the file landed on your machine.
      CUTTINGFLOOR_EXPORTS_HOST_PATH: ${CUTTINGFLOOR_EXPORTS:-${HOME}/cuttingfloor/exports}
    volumes:
      # Timelines, imported media, proxies, jobs and outputs (each with a time limit).
      - cuttingfloor-data:/data
      # Footage the editor may read, read-only. Import with paths like /media/videos/clip.mp4.
      - ${CUTTINGFLOOR_MEDIA:-${HOME}/Movies}:/media/videos:ro
      # Where finished exports are written.
      - ${CUTTINGFLOOR_EXPORTS:-${HOME}/cuttingfloor/exports}:/exports

volumes:
  cuttingfloor-data:
