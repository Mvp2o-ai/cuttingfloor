# Local mode: the same image hosted runs, as a single node on your machine.
#   docker compose up -d
# MCP clients connect to http://127.0.0.1:8787/mcp, or over stdio with
#   docker exec -i cuttingfloor cuttingfloor mcp
services:
  cuttingfloor:
    image: ${CUTTINGFLOOR_IMAGE:-ghcr.io/mvp2o-ai/cuttingfloor:latest}
    build: .
    container_name: ${CUTTINGFLOOR_NAME:-cuttingfloor}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CUTTINGFLOOR_PORT:-8787}:8787"
    networks: [default, motion]
    env_file:
      - path: .env
        required: false
    environment:
      CUTTINGFLOOR_MODE: local
      CUTTINGFLOOR_MEDIA_ROOTS: /media,/samples
      CUTTINGFLOOR_EXPORTS: /exports
      # Shown in export results so you know where the file landed on your machine.
      CUTTINGFLOOR_EXPORTS_HOST_PATH: ${CUTTINGFLOOR_EXPORTS:-${HOME}/cuttingfloor/exports}
      # So export.timeline (FCPXML, OTIO, EDL) points your editor at the files on your machine.
      CUTTINGFLOOR_MEDIA_HOST_PATH: ${CUTTINGFLOOR_MEDIA:-${HOME}/Movies}
      CUTTINGFLOOR_MOTION_URL: http://motion:8790
    volumes:
      # Timelines, imported media, proxies, jobs and outputs (each with a time limit).
      - cuttingfloor-data:/data
      # Footage the editor may read, read-only. Import with paths like /media/videos/clip.mp4.
      - ${CUTTINGFLOOR_MEDIA:-${HOME}/Movies}:/media/videos:ro
      # Where finished exports are written.
      - ${CUTTINGFLOOR_EXPORTS:-${HOME}/cuttingfloor/exports}:/exports

  # The sandbox: the one place agent-written code runs (create.motion, create.still, code.run).
  # Same image; no route out, no data volume, no secrets, nothing writable but a tmpfs, no
  # capabilities, fixed CPU, memory and process limits. Chromium's sandbox and code.run's
  # namespaces need the seccomp profile next to this file (Docker's default plus namespace
  # creation). Memory stays above the tmpfs size, so a full disk is an error, not an OOM.
  motion:
    image: ${CUTTINGFLOOR_IMAGE:-ghcr.io/mvp2o-ai/cuttingfloor:latest}
    container_name: ${CUTTINGFLOOR_NAME:-cuttingfloor}-motion
    command: ["cuttingfloor", "motion-worker"]
    restart: unless-stopped
    networks: [motion]
    environment:
      PORT: "8790"
      HOME: /tmp
      TMPDIR: /tmp
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
      # The image declares /data a volume; here it is an empty scrap, never the data volume.
      - /data:rw,noexec,nosuid,nodev,size=64k
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./tools/motion/seccomp.json
    init: true
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    shm_size: 1g

networks:
  # Internal: the motion service can answer the main container and reach nothing else.
  motion:
    internal: true

volumes:
  cuttingfloor-data:
