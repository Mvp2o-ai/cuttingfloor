<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cuttingfloor upload</title>
<style>
  /*
   * Where the person picks a file and it is sent: the media.upload result as a box in the chat.
   * The file goes from this page to the staging url in the result, in parts, so a broken send
   * carries on. It wears cuttingfloor's own colours, as the library and the player do.
   */
  :root {
    --bg: #0e0d0b;
    --bg-2: #161511;
    --bg-3: #1d1b17;
    --ink: #eee8dc;
    --mute: #8f887c;
    --rule: #2a2722;
    --rule-2: #3a362f;
    --key: #00b140;
    --key-hi: #19c957;
    --red: #e0573f;
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* biome-ignore lint/complexity/noImportantStyles: hidden must beat every display rule below */
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; }
  body { font: 13px/1.45 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, label:focus-within { outline: 2px solid var(--key); outline-offset: 2px; }
  svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .card { background: var(--bg); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  .head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .marker { width: 16px; height: 16px; flex: none; fill: var(--key); stroke: none; }
  .wm { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
  .wm b { color: var(--key); font-weight: 800; margin-left: 4px; }
  .sub { font: 600 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); padding-left: 10px; border-left: 1px solid var(--rule-2); }

  .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px; padding: 18px; border: 1.5px dashed var(--rule-2); border-radius: 12px; background: var(--bg-2); text-align: center; }
  .drop.over { border-color: var(--key); background: var(--bg-3); }
  .drop svg { width: 28px; height: 28px; color: var(--key); }
  .drop b { font-size: 15px; }
  .drop span { color: var(--mute); font-size: 12px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .pill { display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 9px; background: var(--key); color: #04170a; font-weight: 700; }
  .pill { cursor: pointer; }
  .pill:hover { background: var(--key-hi); }
  /* Choose a file and Record side by side, one under the other where the panel is narrow. */
  .picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .rec { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 16px; border-radius: 9px; border: 1.5px solid var(--rule-2); font-weight: 700; }
  .rec:hover { border-color: var(--key); }
  .rec.lead { background: var(--key); border-color: var(--key); color: #04170a; }
  .rec.lead:hover { background: var(--key-hi); }
  .rec.lead i { background: #04170a; }
  .rec i { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
  .other { color: var(--mute); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .other:hover { color: var(--ink); }

  .going { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--bg-2); }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; border-radius: 6px; background: var(--rule-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--key); transition: width .25s linear; }
  .line { display: flex; justify-content: space-between; gap: 10px; color: var(--mute); font-size: 12px; }
  .done .bar i { width: 100%; }
  .done .state { color: var(--key-hi); font-weight: 600; }
  .bad .state { color: var(--red); }
  /* Sharing a sent sound in the community pack: off until the person turns it on. */
  .share { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--bg-2); }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch i { flex: none; width: 34px; height: 20px; border-radius: 20px; background: var(--rule-2); position: relative; transition: background .15s; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
  .switch input:checked + i { background: var(--key); }
  .switch input:checked + i::after { transform: translateX(14px); background: #04170a; }
  .switch input:focus-visible + i { outline: 2px solid var(--key); outline-offset: 2px; }
  .switch b { display: block; font-size: 13.5px; }
  .switch small { display: block; color: var(--mute); font-size: 12px; }
  .fields { display: flex; flex-direction: column; gap: 8px; }
  .fields label { display: flex; flex-direction: column; gap: 4px; color: var(--mute); font-size: 11.5px; }
  .fields input, .fields textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule-2); border-radius: 8px; padding: 7px 9px; }
  .fields textarea { min-height: 54px; resize: vertical; }
  .fields input:focus, .fields textarea:focus { outline: none; border-color: var(--key); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > label { flex: 1 1 140px; }
  .fine { color: var(--mute); font-size: 11.5px; }
  .shared { color: var(--key-hi); font-weight: 600; }
  .share .pill { align-self: flex-start; border: 0; }
  .share .pill[disabled] { opacity: .6; cursor: default; }
  .foot { padding: 8px 14px; border-top: 1px solid var(--rule); color: var(--mute); font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
  .foot button { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="head">
      <div class="brand">
        <svg class="marker" viewBox="0 0 32 32" aria-hidden="true"><path d="M4.4 4.4H24.4L4.4 24.4Z"/><path d="M27.6 7.6V27.6H7.6Z"/></svg>
        <span class="wm">cuttingfloor<b>ai</b></span>
      </div>
      <span class="sub">Add a file</span>
    </div>
    <div class="body">
      <div class="drop" id="drop" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        <b id="ask">Add a video or a photo</b>
        <span id="limit">Drop it here, or choose it from this device.</span>
        <!-- Video and pictures only, so a phone offers its camera roll first. -->
        <div class="picks">
          <label class="pill">Choose a video or photo<input type="file" id="pick" accept="video/*,image/*"></label>
          <!-- A hum, a tapped rhythm, a voice, a song playing nearby: sent like a file, after Send. -->
          <button type="button" class="rec" id="record"><i aria-hidden="true"></i>Record</button>
        </div>
        <!-- No filter: anything else is taken too (music, a recording, a font, a LUT, a document). -->
        <label class="other">Or a sound, or any other file<input type="file" id="other"></label>
      </div>
      <div id="recorder" hidden></div>
      <div class="going" id="going" hidden>
        <div class="name" id="name"></div>
        <div class="bar"><i id="fill"></i></div>
        <div class="line"><span class="state" id="state"></span><span class="mono" id="count"></span></div>
        <button type="button" class="other" id="resend" hidden>Send the recording again</button>
      </div>
      <form class="share" id="share" hidden novalidate>
        <label class="switch">
          <input type="checkbox" id="share-on">
          <i aria-hidden="true"></i>
          <span><b>Share as a community sound</b><small>A small way to give back: other creators can find it and use it in their edits.</small></span>
        </label>
        <div class="fields" id="share-fields" hidden>
          <label>Name<input id="s-name" maxlength="80" required></label>
          <label>What it is<textarea id="s-desc" maxlength="500" required placeholder="The hook from my track, a bass drop at 0:04"></textarea></label>
          <div class="row">
            <label>Category<input id="s-cat" maxlength="60" list="s-cats" required placeholder="Music"></label>
            <label>Tags<input id="s-tags" maxlength="200" placeholder="hype, drop, edm"></label>
          </div>
          <label>Credit as<input id="s-author" maxlength="60" placeholder="Your first name"></label>
          <datalist id="s-cats"></datalist>
          <span class="fine">Share only sounds that are yours to share. You can take it down from your upload page, and sounds people report are taken down.</span>
          <button type="submit" class="pill" id="s-go">Share</button>
          <span class="fine" id="s-note" role="status"></span>
        </div>
      </form>
    </div>
    <div class="foot">
      <span id="note">Waiting for the chat app…</span>
      <button type="button" id="page" hidden>Open the upload page instead</button>
    </div>
  </div>
</div>
<script>
__RECORDER__
(() => {
  const VERSION = '__VERSION__';
  const $ = (s) => document.querySelector(s);
  const root = $('#root');
  const html = document.documentElement;
  // One part of the file per request, so a send that breaks carries on from what arrived.
  const PART = 16 * 1024 * 1024;

  // ---------- host protocol (MCP Apps, ui/*) ----------
  let nextId = 1;
  const pending = new Map();
  const host = { caps: {}, ready: false };
  const send = (msg) => window.parent.postMessage(msg, '*');
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    send({ jsonrpc: '2.0', id, method, params });
  });
  const notify = (method, params) => send({ jsonrpc: '2.0', method, params });
  const openLink = (url) => request('ui/open-link', { url }).catch(() => window.open(url, '_blank', 'noopener'));

  // ---------- the upload ----------
  const S = { upload: null, busy: false, sent: false, audio: false, shared: null, recording: null };
  const AUDIO = /\.(mp3|wav|m4a|aac|flac|ogg|opus)$/i;
  const size = (n) => n >= 1e9 ? `${(n / 1e9).toFixed(2)} GB` : `${(n / 1e6).toFixed(1)} MB`;
  const note = (text) => { $('#note').textContent = text; };

  function going(name, state, cls) {
    $('#drop').hidden = true;
    $('#going').hidden = false;
    $('#going').className = `going ${cls || ''}`;
    $('#name').textContent = name;
    $('#state').textContent = state;
  }
  function progress(at, total) {
    $('#fill').style.width = `${100 * at / Math.max(total, 1)}%`;
    $('#count').textContent = `${size(at)} of ${size(total)}`;
  }
  function again(message) {
    $('#drop').hidden = false;
    note(message);
  }

  async function offset(url) {
    const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
    if (r.status === 403 || r.status === 404) throw Object.assign(new Error('This upload has been used or has expired. Ask in the chat for a new one.'), { final: true });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return { at: Number(r.headers.get('upload-offset') || 0), complete: r.headers.get('upload-complete') === 'true' };
  }

  async function sendFile(file) {
    const up = S.upload;
    if (!up || S.busy || S.sent) return;
    if (up.max_bytes && file.size > up.max_bytes) {
      return again(`${file.name} is ${size(file.size)}; this takes up to ${size(up.max_bytes)}.`);
    }
    S.busy = true;
    $('#resend').hidden = true;
    S.audio = /^audio\//.test(file.type) || AUDIO.test(file.name);
    going(file.name, 'Sending…');
    progress(0, file.size);
    note('Keep this chat open until it is sent.');
    try {
      let { at, complete } = await offset(up.url);
      if (at > file.size) at = 0;
      for (let tries = 0; !complete; ) {
        const end = Math.min(at + PART, file.size);
        progress(at, file.size);
        try {
          const r = await fetch(up.url, {
            method: 'PUT',
            headers: { 'content-range': `bytes ${at}-${end - 1}/${file.size}`, 'upload-name': encodeURIComponent(file.name) },
            body: file.slice(at, end),
          });
          const body = await r.json().catch(() => ({}));
          if (r.status === 413) throw Object.assign(new Error(body.error || 'The file is too big.'), { final: true });
          if (r.status === 403 || r.status === 404) throw Object.assign(new Error('This upload has been used or has expired. Ask in the chat for a new one.'), { final: true });
          if (!r.ok && r.status !== 409) throw new Error(body.error || `HTTP ${r.status}`);
          at = Number(r.headers.get('upload-offset') || end);
          complete = r.headers.get('upload-complete') === 'true';
          tries = 0;
        } catch (error) {
          if (error.final || ++tries > 5) throw error;
          $('#state').textContent = 'Connection dropped; picking up where it stopped…';
          await new Promise((r) => setTimeout(r, 1000 * tries));
          ({ at, complete } = await offset(up.url));
          $('#state').textContent = 'Sending…';
        }
      }
      progress(file.size, file.size);
      await sent(file.name);
    } catch (error) {
      going(file.name, error.message || String(error), 'bad');
      // The page behind the url sends the same file from outside the chat app's frame.
      $('#page').hidden = false;
      // A recording is not on the device to choose again: it stays here to be sent again.
      const recorded = file === S.recording && !error.final;
      $('#resend').hidden = !recorded;
      again(error.final ? 'This upload can no longer be used.' : recorded ? 'It did not go through. Send the recording again to carry on, or open the upload page.' : 'It did not go through. Choose the file again to carry on, or open the upload page.');
    } finally {
      S.busy = false;
    }
  }

  // The file is staged: say so in the chat as the person, which is what starts the next turn.
  async function sent(name) {
    S.sent = true;
    going(name, 'Sent', 'done');
    $('#page').hidden = true;
    if (S.audio) offerShare(name);
    const text = `I sent “${name}” to cuttingfloor (upload_id ${S.upload.upload_id}). Import it.`;
    if (host.caps.message) {
      try {
        const r = await request('ui/message', { role: 'user', content: [{ type: 'text', text }] });
        if (r?.isError) throw new Error('refused');
        return note('It is in. The chat carries on from here.');
      } catch {}
    }
    if (host.caps.updateModelContext) {
      request('ui/update-model-context', { content: [{ type: 'text', text: `The user sent “${name}”: upload ${S.upload.upload_id} is complete.` }] }).catch(() => {});
    }
    note('It is in. Tell the chat you sent it.');
  }

  // ---------- sharing a sent sound (off unless the person turns it on) ----------
  const CATEGORIES = ['Trending sounds', 'Music', 'Meme and hype', 'Voice and quotes'];
  function offerShare(name) {
    $('#share').hidden = false;
    $('#s-name').value = name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').slice(0, 80);
    const list = $('#s-cats');
    const add = (c) => { if (![...list.options].some((o) => o.value === c)) list.append(new Option(c, c)); };
    CATEGORIES.forEach(add);
    fetch(new URL('/sounds?limit=1', S.upload.url).href).then((r) => r.ok ? r.json() : null).then((d) => {
      for (const c of d?.categories || []) add(c.category);
    }, () => {});
  }
  $('#share-on').addEventListener('change', (e) => {
    $('#share-fields').hidden = !e.target.checked || !!S.shared;
  });
  $('#share').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (S.shared) return;
    const say = (t) => { $('#s-note').textContent = t; };
    const body = {
      name: $('#s-name').value.trim(),
      description: $('#s-desc').value.trim(),
      category: $('#s-cat').value.trim(),
      tags: $('#s-tags').value.split(',').map((t) => t.trim()).filter(Boolean).slice(0, 10),
      ...($('#s-author').value.trim() ? { author: $('#s-author').value.trim() } : {}),
    };
    if (!body.name || !body.description || !body.category) return say('Give it a name, say what it is and pick a category.');
    $('#s-go').disabled = true;
    say('Sharing…');
    try {
      const u = new URL(S.upload.url);
      u.pathname += '/share';
      const r = await fetch(u.href, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.sound) throw new Error([d.error, d.hint].filter(Boolean).join('. ') || `HTTP ${r.status}`);
      S.shared = d.sound;
      $('#share-fields').hidden = true;
      $('#share-on').disabled = true;
      const done = document.createElement('span');
      done.className = 'shared';
      done.textContent = `Shared: “${d.sound.name}” is a community sound now. Thank you.`;
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'other';
      link.textContent = 'See it';
      link.addEventListener('click', () => openLink(`https://cuttingfloor.ai/community-sounds?sound=${encodeURIComponent(d.sound.sound_id)}`));
      $('#share').append(done, link);
    } catch (error) {
      $('#s-go').disabled = false;
      say(error.message || String(error));
    }
  });

  function onResult(result) {
    if (!result) return;
    let data = result.structuredContent;
    if (!data && Array.isArray(result.content)) {
      const t = result.content.find((c) => c?.type === 'text');
      try { data = t && JSON.parse(t.text); } catch {}
    }
    if (result.isError || !data?.url) {
      return note(data?.message || result.content?.find((c) => c?.type === 'text')?.text || 'No upload was started.');
    }
    S.upload = data;
    $('#limit').textContent = `Drop it here, or choose it from this device. Up to ${size(data.max_bytes)}.`;
    // A recording was asked for: Record leads, and picking a file stays beside it.
    if (data.record) {
      $('#ask').textContent = 'Record a sound';
      $('#limit').textContent = `Record it here, or choose a file from this device. Up to ${size(data.max_bytes)}.`;
      $('#record').classList.add('lead');
      $('.picks').prepend($('#record'));
    }
    $('#page').hidden = false;
    $('#drop').hidden = false;
    const days = Math.round((Date.parse(data.expires_at) - Date.now()) / 86_400_000);
    note(days >= 1 ? `A file sent here waits ${days} day${days === 1 ? '' : 's'} to be brought into an edit.` : '');
    // A view shown again (the chat reopened) finds what already arrived.
    offset(data.url).then(({ at, complete }) => {
      if (complete) {
        S.sent = true;
        going(data.name || 'Your file', 'Sent', 'done');
        $('#page').hidden = true;
        note('This file is already in.');
        if (data.name && AUDIO.test(data.name)) offerShare(data.name);
      }
      else if (at > 0) note(`${size(at)} is already here. Choose the same file and the rest is sent.`);
    }, (error) => {
      // The frame may not be let through to the server: the page behind the url still is.
      note(error.final ? error.message : 'This chat app does not let files be sent from here. Open the upload page.');
      if (error.final) { $('#drop').hidden = true; $('#page').hidden = true; }
    });
  }

  const drop = $('#drop');
  for (const input of [$('#pick'), $('#other')]) {
    input.addEventListener('change', () => { const f = input.files[0]; input.value = ''; if (f) sendFile(f); });
  }
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) sendFile(f);
  });
  $('#page').addEventListener('click', () => S.upload && openLink(S.upload.url));

  // ---------- recording (the shared recorder; sent as a file once the person taps Send) ----------
  const recorder = window.cfRecorder($('#recorder'), {
    send: (file) => { S.recording = file; sendFile(file); },
    shown: (on) => { $('#drop').hidden = on || !S.upload || S.sent; },
    // Where the chat app keeps the microphone from the box: the upload page records, in the browser.
    fallback: {
      label: 'Record on the upload page',
      say: 'This chat app does not let the box use the microphone. The upload page can: it opens in your browser and sends to this same upload.',
      open: () => S.upload && openLink(`${S.upload.url}#record`),
    },
    maxBytes: () => S.upload?.max_bytes || 0,
  });
  $('#record').addEventListener('click', () => recorder.start());
  $('#resend').addEventListener('click', () => S.recording && sendFile(S.recording));

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (msg?.jsonrpc !== '2.0') return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const p = pending.get(msg.id);
      pending.delete(msg.id);
      if (msg.error) p.reject(new Error(msg.error.message || 'error'));
      else p.resolve(msg.result);
      return;
    }
    if (msg.method === 'ui/notifications/tool-result') whenReady(() => onResult(msg.params || {}));
    else if (msg.method === 'ui/resource-teardown' && msg.id !== undefined) send({ jsonrpc: '2.0', id: msg.id, result: {} });
  });

  // Calls wait for the handshake, so the host's capabilities are known.
  const queue = [];
  function whenReady(fn) { if (host.ready) fn(); else queue.push(fn); }

  new ResizeObserver(() => {
    notify('ui/notifications/size-changed', { width: Math.ceil(html.scrollWidth), height: Math.ceil(root.getBoundingClientRect().height) });
  }).observe(root);

  request('ui/initialize', {
    appInfo: { name: 'cuttingfloor-upload', version: VERSION },
    appCapabilities: {},
    protocolVersion: '2026-01-26',
  }).then((r) => { host.caps = r?.hostCapabilities || {}; }, () => {}).finally(() => {
    host.ready = true;
    notify('ui/notifications/initialized', {});
    for (const fn of queue.splice(0)) fn();
  });
})();
</script>
</body>
</html>
