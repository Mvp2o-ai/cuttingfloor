    split.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      e.stopPropagation();
      setStageH($('#stage').offsetHeight + (e.key === 'ArrowUp' ? -24 : 24));
      store.set('stageH', S.stageH);
    });

    const ruler = $('#ruler'), lanes = $('#lanes'), area = $('#area'), sc = $('#scroller');
    ruler.addEventListener('pointerdown', (e) => { if (!e.target.closest('#knob')) startScrub(e); });
    lanes.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('.clip');
      if (el) return select(el.dataset.id);
      startScrub(e);
    });
    lanes.addEventListener('dblclick', (e) => { const el = e.target.closest('.clip'); if (el) seek(byId.get(el.dataset.id).start); });
    lanes.addEventListener('keydown', (e) => {
      const el = e.target.closest('.clip');
      if (el && e.key === 'Enter') { select(el.dataset.id); seek(byId.get(el.dataset.id).start); }
    });
    const hl = $('#hoverLine'), tip = $('#tip');
    const hover = (e) => {
      if (!S.view) return;
      const fr = Math.max(0, Math.min(S.D, frameAt(e.clientX)));
      const x = `${fr * S.ppf}px`;
      hl.style.display = 'block'; hl.style.left = x;
      const htc = $('#hoverTc');
      if (htc) { htc.style.display = 'block'; htc.style.left = `${fr * S.ppf + 6}px`; htc.textContent = tc(fr); }
      const el = e.target.closest('.clip, .trans');
      if (el && !dragging) {
        let h;
        if (el.classList.contains('trans')) h = `${esc(el.dataset.kind.replace(/_/g, ' '))}<small>${tc(+el.dataset.start, false)} – ${tc(+el.dataset.end, false)}</small>`;
        else {
          const c = byId.get(el.dataset.id);
          h = `${esc(nameOf(c))}<small>${tc(c.start, false)} – ${tc(c.end, false)} · ${len(c.end - c.start)}${c.type === 'media' ? ` · src ${tc(c.source.in, false)}` : ''}</small>`;
        }
        tip.innerHTML = h; tip.style.display = 'block';
        tip.style.left = `${Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12)}px`;
        tip.style.top = `${Math.min(window.innerHeight - tip.offsetHeight - 8, e.clientY + 16)}px`;
      } else tip.style.display = 'none';
    };
    const leave = () => { hl.style.display = 'none'; tip.style.display = 'none'; const htc = $('#hoverTc'); if (htc) htc.style.display = 'none'; };
    area.addEventListener('pointermove', hover);
    ruler.addEventListener('pointermove', hover);
    area.addEventListener('pointerleave', leave);
    ruler.addEventListener('pointerleave', leave);
    sc.addEventListener('scroll', () => paintCanvases(), { passive: true });
    sc.addEventListener('wheel', (e) => {
      if (!(e.ctrlKey || e.metaKey) || !S.view) return;
      e.preventDefault();
      setZoom(S.ppf * Math.exp(-e.deltaY * 0.01), frameAt(e.clientX));
    }, { passive: false });

    $('#zoom').addEventListener('input', (e) => {
      const min = S.fitPpf, max = Math.max(min * 2, 16);
      setZoom(min * (max / min) ** (Number(e.target.value) / 100));
    });
    $('#zIn').onclick = () => setZoom(S.ppf * 1.6);
    $('#zOut').onclick = () => setZoom(S.ppf / 1.6);
    $('#fit').onclick = fit;
    $('#follow').onclick = () => { S.follow = !S.follow; $('#follow').classList.toggle('on', S.follow); };
    $('#compact').onclick = () => { S.compact = !S.compact; store.set('compact', S.compact); $('#compact').classList.toggle('on', S.compact); renderLanes(); onLayout(); };
    $('#compact').classList.toggle('on', S.compact);

    document.addEventListener('keydown', (e) => {
      if (e.target.closest?.('input, textarea')) {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'note') { e.preventDefault(); sendNote(); }
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey || !S.view) return;
      const k = e.key;
      if (k === ' ' || k === 'k') { if (e.target instanceof HTMLButtonElement && k === ' ') return; e.preventDefault(); togglePlay(); }
      else if (k === 'ArrowLeft') { e.preventDefault(); seek(Math.floor(S.t) - (e.shiftKey ? Math.round(S.fps) : 1), { pause: true }); }
      else if (k === 'ArrowRight') { e.preventDefault(); seek(Math.floor(S.t) + (e.shiftKey ? Math.round(S.fps) : 1), { pause: true }); }
      else if (k === 'j') seek(S.t - 5 * S.fps);
      else if (k === 'l') seek(S.t + 5 * S.fps);
      else if (k === '[') prevCut();
      else if (k === ']') nextCut();
      else if (k === 'i' || k === 'o') {
        const fr = Math.floor(S.t);
        const [a, b] = S.loop ?? [0, S.D];
        S.loop = k === 'i' ? [fr, Math.max(fr + 1, b)] : [Math.min(a, Math.max(0, fr - 1)), Math.max(1, fr)];
        S.loopOn = true; $('#loopBtn').classList.add('on'); renderRuler();
        toast(`Loop ${tc(S.loop[0], false)} – ${tc(S.loop[1], false)}`);
        scheduleContext();
      } else if (k === 'Escape') {
        if (S.composing) return setTab(S.tab);
        S.loop = null; S.loopOn = false; $('#loopBtn').classList.remove('on'); renderRuler(); scheduleContext();
      } else if (k === '+' || k === '=') setZoom(S.ppf * 1.6);
      else if (k === '-') setZoom(S.ppf / 1.6);
      else if (k === '0') fit();
      else if (k === 'm') $('#mute').click();
      else if (k === 'e') setMini(!S.mini);
      else if (k === 'Home') seek(0);
      else if (k === 'End') seek(S.D - 1);
    });

    new ResizeObserver(() => {
      if (!S.view) return;
      const wasFit = S.ppf <= S.fitPpf * 1.001;
      measureFit();
      if (wasFit) fit(); else setZoom(S.ppf);
    }).observe($('#scroller'));
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => paintCanvases());
  }

  function onLayout() {
    paintHeader();
    // A fixed-height frame keeps the timeline short (it scrolls) so the picture shows whole;
    // inline it grows to ~8 rows.
    const fixed = html.classList.contains('fill') || html.classList.contains('full');
    const sc = $('#scroller');
    if (sc) sc.style.setProperty('--tl-max', fixed ? `${Math.max(72, Math.min(300, Math.round(window.innerHeight * 0.28)))}px` : '300px');
    if (S.stageH && !S.mini) setStageH(S.stageH);
    if (S.view) { measureFit(); if (S.ppf < S.fitPpf) fit(); paintCanvases(); }
  }

  // ---------- data ----------
  function showTimeline() {
    paintHeader();
    paintLegend();
    $('#tab-words').hidden = !captions.length;
    $('#wordsN').textContent = captions.reduce((n, c) => n + (c.words?.length || 1), 0);
    renderLanes();
    fit();
    tick();
    renderPane(true);
    maybeMix();
  }
  // A host that won't relay tools/call still gets a scrubbable ruler over the file.
  function fallbackTimeline(seconds, frames) {
    if (S.view || !Number.isFinite(seconds)) return;
    const fps = frames && seconds ? frames / seconds : 30;
    index({ name: 'Export', sequence: { width: 0, height: 0, fps: { num: Math.round(fps * 1000), den: 1000 } }, duration: Math.max(1, Math.round(frames || seconds * fps)), tracks: [], media: {} });
    paintHeader();
    $('#tlMeta').textContent = '';
    $('#corner').textContent = '';
    renderLanes();
    fit();
    tick();
  }

  async function loadTimeline(id) {
    if (S.timelineId === id && (S.view || S.loading)) return;
    S.timelineId = id;
    S.loading = true;
    if (!host.caps.serverTools) {
      S.timelineError = 'This chat app does not let the view read the timeline, so only the file shows.';
      $('#tlNote').hidden = false; $('#tlNote').textContent = S.timelineError;
      renderPane(true);
      if (media && Number.isFinite(media.duration)) fallbackTimeline(media.duration, S.file?.frames);
      return;
    }
    try {
      const view = await callTool('timeline.get', { timeline_id: id });
      index(view);
      showTimeline();
    } catch (e) {
      S.timelineError = `The timeline did not load: ${e.message}`;
      $('#tlNote').hidden = false; $('#tlNote').textContent = S.timelineError;
      renderPane(true);
      if (media && Number.isFinite(media.duration)) fallbackTimeline(media.duration, S.file?.frames);
      return;
    } finally {
      S.loading = false;
    }
    loadLastEdit();
  }

  // The edit that made this timeline: its history entry, and what it changed against its parent.
  async function loadLastEdit() {
    const view = S.view;
    if (!view?.parent) return;
    try {
      const [hist, diff, parent] = await Promise.all([
        callTool('timeline.history', { timeline_id: view.timeline_id, limit: 1 }),
        callTool('timeline.diff', { from: view.parent, to: view.timeline_id }),
        callTool('timeline.get', { timeline_id: view.parent }).catch(() => null),
      ]);
      S.last = hist?.entries?.[0] || null;
      const before = new Map((parent?.tracks || []).flatMap((t) => t.clips.map((c) => [c.id, { ...c, track: t.id }])));
      changed = new Map();
      for (const ch of diff?.changed || []) {
        if (ch.type !== 'clip') continue;
        const was = before.get(ch.id);
        const moved = was && (was.start !== ch.start || was.end !== ch.end || was.track !== ch.track_id);
        changed.set(ch.id, { change: ch.change, was: was && (ch.change === 'removed' || moved) ? { start: was.start, end: was.end, track: was.track } : null });
      }
      paintLastEdit(diff?.changed || []);
      renderLanes();
    } catch {
      // The strip is a convenience; the timeline already shows.
    }
  }
  function paintLastEdit(all) {
    const box = $('#lastEdit');
    if (!S.last?.tool) { box.hidden = true; return; }
    const clips = all.filter((c) => c.type === 'clip');
    const counts = ['added', 'modified', 'removed'].map((k) => [k, clips.filter((c) => c.change === k).length]).filter(([, n]) => n);
    const words = { added: 'added', modified: 'changed', removed: 'removed' };
    const others = all.length - clips.length;
    const summary = [...counts.map(([k, n]) => `${n} clip${n > 1 ? 's' : ''} ${words[k]}`), others ? `${others} other change${others > 1 ? 's' : ''}` : null].filter(Boolean).join(', ') || 'no changes';
    const first = clips.find((c) => c.change !== 'removed' && byId.has(c.id));
    box.hidden = false;
    box.innerHTML = `<span class="dot"></span><span>Last edit <code>${esc(S.last.tool)}</code>: ${esc(summary)}</span><div class="grow"></div>${first ? '<button class="linkbtn" id="goChange" type="button">Go to it</button>' : ''}${changed.size ? `<button class="linkbtn" id="toggleChange" type="button">${S.showChange ? 'Hide' : 'Show'} changes</button>` : ''}`;
    if (first) $('#goChange').onclick = () => { const c = byId.get(first.id); select(c.id); seek(c.start); reveal(c.start, c.end); };
    const tg = $('#toggleChange');
    if (tg) tg.onclick = () => { S.showChange = !S.showChange; paintLastEdit(all); renderLanes(); };
  }

  // ---------- the export ----------
  let following = 0;
  async function follow(jobId) {
    const mine = ++following;
    for (let first = true; ; first = false) {
      // job.get answers at once, so the view checks back on its own interval.
      if (!first) await new Promise((r) => setTimeout(r, 1000));
      if (mine !== following) return;
      let job;
      try {
        job = await callTool('job.get', { job_id: jobId });
      } catch (e) {
        if (mine !== following) return;
        return stageError(`Lost track of the export: ${e.message}.`, () => { stageWait('Checking…'); follow(jobId); });
      }
      if (mine !== following) return;
      if (!job) return stageError('The job could not be read.');
      if (job.status === 'completed' && job.result) return onFile(job.result);
      if (job.status === 'failed' || job.status === 'cancelled') return stageError(job.error?.message || `The export ${job.status}.`);
      stageWait(job.status_message || 'Exporting…', job.progress);
    }
  }
  function onFile(data) {
    S.file = data;
    paintHeader();
    stageFile(data);
  }
  function render(data) {
    if (!data) return stageError('Nothing to show.');
    if (data.url) return onFile(data);
    if (data.job_id && data.status && data.status !== 'completed') {
      stageWait(data.status_message || 'Exporting…', data.progress);
      if (host.caps.serverTools) return follow(data.job_id);
      return stageWait('Exporting… This chat app does not let the view check on it; ask for the result when it is done.');
    }
    stageError('Nothing to play yet.');
  }
  function onResult(result) {
    if (!result) return;
    let data = result.structuredContent;
    if (!data && Array.isArray(result.content)) {
      const t = result.content.find((c) => c?.type === 'text');
      try { data = t && JSON.parse(t.text); } catch {}
    }
    if (result.isError) return stageError(data?.message || result.content?.find((c) => c?.type === 'text')?.text || 'The export failed.');
    render(data);
  }

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (msg?.jsonrpc !== '2.0') return;
    if (msg.id !== undefined && pending.has(msg.id) && !msg.method) {
      const p = pending.get(msg.id);
      pending.delete(msg.id);
      if (msg.error) p.reject(new Error(msg.error.message || 'error'));
      else p.resolve(msg.result);
      return;
    }
    const params = msg.params || {};
    if (msg.method === 'ui/notifications/tool-input') {
      const id = params.arguments?.timeline_id;
      if (typeof id === 'string') whenReady(() => loadTimeline(id));
      if (!S.file) stageWait('Exporting…');
    } else if (msg.method === 'ui/notifications/tool-result') whenReady(() => onResult(params));
    else if (msg.method === 'ui/notifications/tool-cancelled') stageError(`The export was cancelled${params.reason ? `: ${params.reason}` : '.'}`);
    else if (msg.method === 'ui/notifications/host-context-changed') applyContext(params);
    else if (msg.method === 'ui/resource-teardown' && msg.id !== undefined) {
      following++;
      if (media) media.pause();
      send({ jsonrpc: '2.0', id: msg.id, result: {} });
    }
  });

  // Tool calls wait for the handshake, so the host's capabilities are known.
  const queue = [];
  function whenReady(fn) { if (host.ready) fn(); else queue.push(fn); }

  new ResizeObserver(() => {
    notify('ui/notifications/size-changed', { width: Math.ceil(html.scrollWidth), height: Math.ceil(root.getBoundingClientRect().height) });
  }).observe(root);
  window.addEventListener('resize', () => ui?.onLayout());

  ui = build();
  stageWait('Getting ready…');
  tick();
  request('ui/initialize', {
    appInfo: { name: 'cuttingfloor-editor', version: VERSION },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    protocolVersion: '2026-01-26',
  }).then((r) => {
    host.caps = r?.hostCapabilities || {};
    applyContext(r?.hostContext);
  }, () => {}).finally(() => {
    host.ready = true;
    notify('ui/notifications/initialized', {});
    for (const fn of queue.splice(0)) fn();
    paintHeader();
  });
})();
</script>
</body>
</html>
